title   MahaDevan's OS (x86_64, UEFI, LTS kernel)
linux   /arch/boot/x86_64/vmlinuz-linux-lts
# microcode lives inside the initramfs (mkinitcpio "microcode" hook); archiso
# ships no separate ucode images, see mahadevanos-linux.conf.
initrd  /arch/boot/x86_64/initramfs-linux-lts.img
options archisobasedir=arch archisolabel=@ISO_LABEL@ copytoram=n quiet console=tty0 console=ttyS0,115200 systemd.firstboot=no
