title   MahaDevan's OS (x86_64, UEFI)
linux   /arch/boot/x86_64/vmlinuz-linux
initrd  /arch/boot/intel-ucode.img
initrd  /arch/boot/amd-ucode.img
initrd  /arch/boot/x86_64/initramfs-linux.img
# console=tty0 keeps the real screen; console=ttyS0 mirrors kernel/systemd output to
# the serial port so headless QEMU runs produce evidence logs (scripts/test-boot.sh).
options archisobasedir=arch archisolabel=@ISO_LABEL@ copytoram=n quiet console=tty0 console=ttyS0,115200
