title   MahaDevan's OS (x86_64, UEFI)
linux   /arch/boot/x86_64/vmlinuz-linux
# The mkinitcpio "microcode" hook (iso/profile/airootfs/etc/mkinitcpio.conf)
# embeds intel/amd microcode inside the initramfs, so archiso does not copy
# /arch/boot/*-ucode.img onto the ISO. Listing them here breaks the boot with
# "Error preparing initrd: Not found" (tests/evidence/2026-11-21).
initrd  /arch/boot/x86_64/initramfs-linux.img
# console=tty0 keeps the real screen; console=ttyS0 mirrors kernel/systemd output to
# the serial port so headless QEMU runs produce evidence logs (scripts/test-boot.sh).
# systemd.firstboot=no: mkarchiso leaves /etc/machine-id as "uninitialized", so
# systemd-firstboot would otherwise run its interactive "Initial Setup" before
# sysinit.target and stall the live boot on the console. Locale and timezone are
# set by Calamares at install time, never here.
options archisobasedir=arch archisolabel=@ISO_LABEL@ copytoram=n quiet console=tty0 console=ttyS0,115200 systemd.firstboot=no
