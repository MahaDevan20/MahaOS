title   MahaDevan's OS (safe graphics, no KMS)
linux   /arch/boot/x86_64/vmlinuz-linux
# microcode lives inside the initramfs (mkinitcpio "microcode" hook); archiso
# ships no separate ucode images, see mahadevanos-linux.conf.
initrd  /arch/boot/x86_64/initramfs-linux.img
options archisobasedir=arch archisolabel=@ISO_LABEL@ copytoram=n nomodeset quiet console=tty0 console=ttyS0,115200 systemd.firstboot=no
