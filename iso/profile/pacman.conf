# Build-only pacman.conf for MahaDevan's OS ISO.
# Arch Linux repositories ONLY. Never add CachyOS, Garuda, chaotic-aur or any
# [*-v3] repository here: the ISO must be a plain Arch x86_64 system (blueprint §2 #16).
# The installed system gets a normal mirrorlist from installer/postinstall.
#
# Repositories are pinned to the Arch Linux Archive date in ../PINNED_DATE so builds
# are repeatable. pacman expands only $repo and $arch, so the date is written as the
# @PINNED_DATE@ placeholder: scripts/build-iso.sh substitutes it in a working copy of
# this profile and refuses to build if any placeholder is left unresolved.

[options]
HoldPkg      = pacman glibc
Architecture = x86_64
CheckSpace
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8

# Explicit Server lines only: no Include of a mirrorlist, so the build chroot needs
# no host mirrorlist file.
#
# One server per repository, and it is the pinned archive: a live mirror as a
# "fallback" is not a fallback, it is a different snapshot. When the archive was
# slow on 2026-11-23 pacman fetched `linux` (7.3.5) and then `ostree` from
# geo.mirror.pkgbuild.com while the rest of the transaction came from
# 2026/11/01, and the install died with
#   :: unable to satisfy dependency 'libcrypto.so=4-64' required by ostree
# A missing or slow archive must fail the build, not silently mix two dates.
[core]
Server = https://archive.archlinux.org/repos/@PINNED_DATE@/core/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/@PINNED_DATE@/extra/os/$arch

# multilib is required: the ISO ships lib32-vulkan-icd-loader for 32-bit games.
[multilib]
Server = https://archive.archlinux.org/repos/@PINNED_DATE@/multilib/os/$arch

# Local repository built by scripts/build-repo.sh (Calamares, ckbcomp, branding).
[mahadevanos-local]
SigLevel = Optional TrustAll
Server = file:///home/mahadevanos/repo/$arch
