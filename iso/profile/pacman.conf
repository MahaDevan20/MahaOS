# Build-only pacman.conf for MahaDevan's OS ISO.
# Arch Linux repositories ONLY. Never add CachyOS, Garuda, chaotic-aur or any
# [*-v3] repository here: the ISO must be a plain Arch x86_64 system (blueprint §2 #16).
# The installed system gets a normal mirrorlist from installer/postinstall.
#
# Repositories are pinned to the Arch Linux Archive date in ../PINNED_DATE so builds
# are repeatable. scripts/build-iso.sh exports $ARCHISO_PINNED_DATE and refuses to run
# if this file has been hand-edited to point elsewhere.

[options]
HoldPkg      = pacman glibc
Architecture = x86_64
CheckSpace
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8

# Explicit Server lines only: no Include of a mirrorlist, so the build chroot needs
# no host mirrorlist file. The pinned archive is first; a live mirror is a fallback
# in case the archive date has propagated out of the archive index.
[core]
Server = https://archive.archlinux.org/repos/$ARCHISO_PINNED_DATE/core/os/$arch
Server = https://geo.mirror.pkgbuild.com/core/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/$ARCHISO_PINNED_DATE/extra/os/$arch
Server = https://geo.mirror.pkgbuild.com/extra/os/$arch

# Local repository built by scripts/build-repo.sh (Calamares, ckbcomp, branding).
[mahadevanos-local]
SigLevel = Optional TrustAll
Server = file:///home/mahadevanos/repo/$arch
