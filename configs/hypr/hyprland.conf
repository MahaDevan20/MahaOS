# MahaDevan's OS — Hyprland default configuration.
# Installed as /etc/xdg/hypr/hyprland.conf and copied into /etc/skel for new users.
# Split into conf.d/ modules so a broken keybind file cannot take the session down.

$mod = SUPER

source = /etc/xdg/hypr/conf.d/10-monitors.conf
source = /etc/xdg/hypr/conf.d/20-input.conf
source = /etc/xdg/hypr/conf.d/30-keybinds.conf
source = /etc/xdg/hypr/conf.d/40-autostart.conf
source = /etc/xdg/hypr/conf.d/50-look.conf

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(23ebd1ee) rgba(1b6b7aee) 45deg
    col.inactive_border = rgba(2a3644aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, easeOut
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 4, easeOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# Safe fallback: if a module above breaks, SUPER+SHIFT+R reloads this file and
# CTRL+ALT+F2 always reaches a TTY.
bind = $mod SHIFT, R, exec, hyprctl reload
