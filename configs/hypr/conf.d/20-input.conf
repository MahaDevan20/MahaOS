# Input: US keyboard, natural touchpad scrolling, tap-to-click.
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}
