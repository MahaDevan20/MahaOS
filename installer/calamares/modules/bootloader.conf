---
# GRUB (UEFI) with the identifier "mahadevanos". os-prober picks up other OSes.
# efiBootloaderId is the 3.4.2 schema key (note the lowercase l) for the
# bootloader id written into the NVRAM entry and /boot/efi/EFI/<id>/.
efiBootLoader: "grub"
efiBootloaderId: "mahadevanos"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
