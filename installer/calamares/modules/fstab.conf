---
# Calamares 3.4.2 fstab module (src/modules/fstab/fstab.schema.yaml,
# main.py: only `crypttabOptions` and `tmpOptions` are read; `tmpOptions` is a
# required key).
#
# The old `efiMountOptions:` key does not exist in 3.4.2 — the ESP options come
# from mount.conf's `mountOptions` entry for filesystem `efi`
# (`defaults,umask=0077`), which the module writes into /etc/fstab.
crypttabOptions: "luks"

# tmpfs on /tmp is deliberately off: the installed system must not lose files in
# /tmp on a reboot, and the 2.6 GiB squashfs unpack is exactly the case where a
# tmpfs target hides a broken mount (2026-11-21 rsync exit 11).
tmpOptions:
    default:
        tmpfs: false
        options: "defaults,noatime,mode=1777"
    ssd:
        tmpfs: false
        options: "defaults,noatime,mode=1777"
