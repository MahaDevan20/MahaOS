---
# Calamares 3.4.2 displaymanager module.
#
# The module reads `displaymanagers:` (src/modules/displaymanager/main.py,
# run(): `libcalamares.job.configuration["displaymanagers"]`) and the schema
# (displaymanager.schema.yaml) allows exactly displaymanagers,
# defaultDesktopEnvironment, basicSetup, sysconfigSetup, greetd, lightdm, sddm.
# There is no `services:` key in this module: with one, the list stayed empty
# and the install aborted at 75% with
#   "No display managers selected for the displaymanager module."
#
# sddm is the only DM shipped on the ISO; it is enabled later by
# services-systemd.conf and configured by /etc/sddm.conf.d/10-mahadevanos.conf
# from mahadevanos-branding.
displaymanagers:
  - sddm

# Leave user/group/var setup of the display-manager account to the package.
basicSetup: false
