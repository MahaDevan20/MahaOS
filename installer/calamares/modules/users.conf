---
# Real user account. No autologin, no passwordless sudo on the installed system.
defaultGroups:
    - wheel
    - users
    - audio
    - video
    - network
    - storage
    - lp
    - optical
    - scanner
    - power
    - rfkill
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    wheel
setRootPassword: false
allowWeakPasswords: false
allowWeakPasswordsDefault: false
# 3.4.2 (users.schema.yaml) has no top-level `userShell:`; the shell is a
# sub-key of `user:`.
user:
    shell: /bin/bash
