---
# Calamares 3.4.2 mount module.
#
# The mount module mounts every partition from global storage sorted by mount
# point, so "/" is mounted on the Btrfs root partition before anything else and
# before unpackfs runs. Btrfs subvolumes are created and mounted here too: the
# 3.4.2 module reads `btrfsSubvolumes` from *this* file (not partition.conf)
# and writes the result to global storage for the fstab module.
#
# `rootSubvolume` is not a Calamares 3.4.2 key and was removed; the root
# subvolume comes from the "/" entry below.

# Extra (non-disk) filesystems mounted into the target: the postinstall
# shellprocess scripts run in a chroot and need /proc, /sys, /dev, /run and
# efivarfs (grub-install registers the NVRAM entry). Without this list the
# module logs "No extra mounts defined. Does mount.conf exist?".
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /.snapshots
      subvolume: /@snapshots

# The mount options are also what the fstab module writes, per mount point.
mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
