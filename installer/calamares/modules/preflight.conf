---
# Guard between the mount and unpackfs modules.
#
# unpackfs copies ~2.6 GiB of squashfs image into the target; if the root
# partition was not mounted (Calamares skips unformatted partitions), that
# target is the installer's tmpfs and rsync dies with exit 11 after filling RAM.
# This runs on the live system and aborts the install with a clear message
# before unpackfs starts.
dontChroot: true
timeout: 60
verbose: true
script:
    - "/usr/share/mahadevanos/calamares/check-root-mount.sh ${ROOT}"
