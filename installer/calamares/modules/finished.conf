---
# Calamares 3.4.2 finished page (src/modules/finished/finished.schema.yaml).
#
# Without this module in settings.conf's *show* sequence the install ends on the
# progress page at 100% "Done" with no way to restart from the installer.
#
# restartNowMode is what 3.4.2 actually acts on; restartNowEnabled and
# restartNowChecked are kept because they are the documented legacy spelling of
# "show the restart checkbox, unchecked by default" (Config.cpp only looks at
# them when restartNowMode is absent, so they cannot contradict it).
restartNowEnabled: true
restartNowChecked: false
restartNowMode: user-unchecked
restartNowCommand: "systemctl -i reboot"

# No DBus notification: Calamares runs as root on the live user's Wayland
# socket, so it cannot reach the session bus reliably.
notifyOnFinished: false
