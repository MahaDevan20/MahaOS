---
# Calamares 3.4.2 finished page (src/modules/finished/finished.schema.yaml).
#
# `finished` must be the last step of settings.conf (after the exec phase), and
# quit-at-end must be false there, or Calamares quits the moment the page is
# shown and the restart controls are never usable.
#
# restartNowMode is the key 3.4.2 acts on (Config::setConfigurationMap). The two
# legacy keys are only read when restartNowMode is absent; they are kept, set to
# the same meaning, so a downgrade cannot silently disable the restart.
#
# user-checked: the box is ticked, so clicking Done restarts into the installed
# system. Calamares runs this command through /bin/sh -c as root, which is why a
# systemctl call works here even in the live session.
restartNowEnabled: true
restartNowChecked: true
restartNowMode: user-checked
restartNowCommand: "systemctl reboot"

# No DBus notification: Calamares runs as root on the live user's Wayland
# socket, so it cannot reach the session bus reliably.
notifyOnFinished: false
