---
# Calamares 3.4.2 grubcfg module (src/modules/grubcfg/grubcfg.schema.yaml).
#
# 3.4.2 reads `kernel_params:` (a list). The old singular `kernelParam:` is not
# a key of this module: with it Calamares fell back to its own default ["quiet"]
# and logged a configuration error.
#
# grubcfg edits /etc/default/grub in place and keeps every key it does not own,
# so the MahaDevan defaults installed by postinstall/15-branding.sh (GRUB_TOP_LEVEL
# for the `linux` kernel, the serial console, theme, timeouts) survive, and on a
# btrfs root it also forces GRUB_SAVEDEFAULT=false.
# Merged into GRUB_CMDLINE_LINUX_DEFAULT of the installed system (grubcfg
# replaces the value that configs/grub/grub-defaults ships, so keep those flags
# here). console=tty0 keeps the screen and console=ttyS0,115200 makes the
# installed system reachable on a serial console: GRUB already talks to serial
# (GRUB_TERMINAL_* in grub-defaults), and systemd's getty generator starts
# serial-getty@ttyS0 for the console= parameter, which is how headless installs
# (and the installed-disk boot test) get a login prompt.
kernel_params:
  - "quiet"
  - "nowatchdog"
  - "zswap.enabled=0"
  - "console=tty0"
  - "console=ttyS0,115200"
