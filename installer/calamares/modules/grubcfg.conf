---
# Calamares 3.4.2 grubcfg module (src/modules/grubcfg/grubcfg.schema.yaml).
#
# 3.4.2 reads `kernel_params:` (a list). The old singular `kernelParam:` is not
# a key of this module: with it Calamares fell back to its own default ["quiet"]
# and logged a configuration error.
#
# grubcfg edits /etc/default/grub in place and keeps every key it does not own,
# so the MahaDevan defaults installed by postinstall/15-branding.sh (GRUB_TOP_LEVEL
# for the `linux` kernel, the serial console, theme, timeouts) survive, and on a
# btrfs root it also forces GRUB_SAVEDEFAULT=false.
kernel_params:
  - "quiet"
