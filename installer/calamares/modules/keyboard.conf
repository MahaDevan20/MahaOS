---
# Live session is US by default; the user picks their layout here.
# ckbcomp (from the local repo) converts the X11 layout into a console keymap,
# so no network access is needed for vconsole-setup.
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/etc/vconsole.conf"
