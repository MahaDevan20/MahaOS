---
# systemd units enabled on the installed system (blueprint §5 M2 item 4).
#
# Calamares 3.4.2 (src/modules/services-systemd/main.py, services-systemd.schema
# .yaml) reads `units:` entries of {name, action, mandatory}. `mandatory`
# defaults to false, but it is written out explicitly here: only the two units
# the installed system cannot work without are mandatory, so a unit that a
# package renames or drops (snapper timers, grub-btrfsd, power-profiles-daemon,
# ufw) can never abort the install at 90%.
units:
    # Required: without a network stack or a display manager the installed
    # system is unusable, so these two failures must stop the install.
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "sddm.service"
      action: "enable"
      mandatory: true

    # Optional: enabled when present, failure ignored.
    - name: "bluetooth.service"
      action: "enable"
      mandatory: false
    - name: "ufw.service"
      action: "enable"
      mandatory: false
    - name: "systemd-timesyncd.service"
      action: "enable"
      mandatory: false
    - name: "fstrim.timer"
      action: "enable"
      mandatory: false
    - name: "snapper-timeline.timer"
      action: "enable"
      mandatory: false
    - name: "snapper-cleanup.timer"
      action: "enable"
      mandatory: false
    - name: "grub-btrfsd.service"
      action: "enable"
      mandatory: false
    - name: "power-profiles-daemon.service"
      action: "enable"
      mandatory: false
