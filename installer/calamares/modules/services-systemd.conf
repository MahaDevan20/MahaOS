---
# systemd units enabled on the installed system (blueprint §5 M2 item 4).
units:
    - name: "NetworkManager.service"
      action: "enable"
    - name: "sddm.service"
      action: "enable"
    - name: "bluetooth.service"
      action: "enable"
    - name: "ufw.service"
      action: "enable"
    - name: "systemd-timesyncd.service"
      action: "enable"
    - name: "fstrim.timer"
      action: "enable"
    - name: "snapper-timeline.timer"
      action: "enable"
    - name: "snapper-cleanup.timer"
      action: "enable"
    - name: "grub-btrfsd.service"
      action: "enable"
    - name: "power-profiles-daemon.service"
      action: "enable"
