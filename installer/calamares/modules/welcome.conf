---
# Calamares 3.4.2 welcome module (src/modules/welcome/welcome.schema.yaml).
# The install is offline by design: no connectivity requirement at all. The
# internet check URL is a sub-key of `requirements:` in 3.4.2 (a top-level
# `internetCheckUrl:` is not part of the schema), so it is simply not set.
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false

requirements:
  requiredStorage: 20
  requiredRam: 3.0
  check:
    - storage
    - ram
    - power
