---
# Btrfs with the subvolume layout from blueprint §3, GRUB UEFI, 1 GiB ESP.
# LUKS1 only: GRUB cannot unlock LUKS2/argon2id. Experimental until M5 proves it.
efiSystemPartition:     "/boot/efi"
userSwapChoices:
    - none
    - small
    - suspend
    - file
swapPartitionName:      "swap"
ensureSuspendToDisk:    true
neverCreateSwap:        false

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
defaultFileSystemType:  "btrfs"
enableLuksAutomatedPartitioning: true
allowManualPartitioning:   true
partitionLayout:
    - name: "boot"
      fs: "fat32"
      mountPoint: "/boot/efi"
      size: 1024MiB
      features: [ esp ]
    - name: "root"
      fs: "btrfs"
      mountPoint: "/"
      size: 100%          # grows to fill the disk

btrfsSubvolumes:
    - mountPoint: "/"
      subvolume: "/@"
      options: [ "compress=zstd:1", "noatime" ]
    - mountPoint: "/home"
      subvolume: "/@home"
      options: [ "compress=zstd:1", "noatime" ]
    - mountPoint: "/var/log"
      subvolume: "/@log"
      options: [ "compress=zstd:1", "noatime" ]
    - mountPoint: "/var/cache"
      subvolume: "/@cache"
      options: [ "compress=zstd:1", "noatime" ]
    - mountPoint: "/.snapshots"
      subvolume: "/@snapshots"
      options: [ "compress=zstd:1", "noatime" ]

# GRUB cannot unlock LUKS2 with argon2id, so encryption stays on LUKS1.
luksGeneration: "luks1"
