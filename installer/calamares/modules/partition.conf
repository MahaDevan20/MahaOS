---
# Offline install layout: exactly one 1 GiB FAT32 ESP at /boot/efi plus one
# Btrfs root. GRUB cannot unlock LUKS2/argon2id, so encryption stays on LUKS1.
#
# Two Calamares 3.4.2 facts drive this file (verified in the 3.4.2 sources):
#
# 1. PartitionActions::doAutopartition() ALWAYS prepends the EFI system
#    partition on an EFI system and sizes it from efi.recommendedSize. Listing
#    an ESP in partitionLayout therefore creates a *second* ESP; the 2026-11-21
#    install had a 300 MiB ESP from the automatic prepend plus our 1024 MiB
#    entry, and two partitions claiming /boot/efi.
#
# 2. partitionLayout keys are `filesystem:` and `features:` (a map).
#    `fs:` is only understood by mount.conf's extraMounts. With `fs:`, the
#    entries were created as "unformatted", the mount module returns early for
#    each of them, "/" was never mounted on the target disk and unpackfs wrote
#    the whole squashfs into the installer's tmpfs until rsync failed (exit 11).
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    1024MiB
    minimumSize:        1024MiB
    label:              "EFI"

# New-style swap settings only: mixing userSwapChoices with the old
# swapPartitionName/ensureSuspendToDisk/neverCreateSwap keys makes Calamares log
# "Partition-module configuration mixes old- and new-style swap settings" and
# fall back to its built-in choice set.
userSwapChoices:
    - none
    - small
    - suspend
    - file

# Erase disk is preselected so the offline install is one click. Calamares 3.4.2
# reads only `initialPartitioningChoice` and `allowManualPartitioning` for the
# choice page (Config.cpp setConfigurationMap); the older `availableChoices`
# key does not exist in 3.4.2, and because partition.schema.yaml sets
# additionalProperties: false, writing it would only add a schema warning.
# The Erase radio button is drawn unless a partition of the selected disk is
# *mounted* (ChoicePage::setupActions, "Suppress 'erase' if so"), which is why
# the live launcher releases stale /tmp/calamares-root-* mounts before it
# starts Calamares.
initialPartitioningChoice: "erase"
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
defaultFileSystemType:  "btrfs"
enableLuksAutomatedPartitioning: true
allowManualPartitioning:   true

# No ESP entry here: Calamares prepends the one described by `efi:` above.
partitionLayout:
    - name: "root"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%          # grows to fill the disk

# Btrfs subvolumes live in mount.conf: the 3.4.2 mount module reads
# `btrfsSubvolumes` from its own configuration and inserts the result into
# global storage for the fstab module. See modules/mount.conf.

# GRUB cannot unlock LUKS2 with argon2id, so encryption stays on LUKS1.
luksGeneration: "luks1"
