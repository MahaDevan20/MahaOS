---
# Runs inside the target chroot, in order. Cleanup is deliberately last so the
# scripts cannot delete themselves while executing.
#
# Calamares 3.4.2 reads this list from `script:` only; the old `commands:` key
# is ignored (the job then logs "No script given for ShellProcessJob" and does
# nothing), so this file must keep using `script:`.
dontChroot: false
timeout: 1800
script:
    - "/usr/share/mahadevanos/postinstall/10-mkinitcpio.sh"
    - "/usr/share/mahadevanos/postinstall/15-branding.sh"
    - "/usr/share/mahadevanos/postinstall/20-keyring.sh"
    - "/usr/share/mahadevanos/postinstall/30-mirrors.sh"
    - "/usr/share/mahadevanos/postinstall/40-snapshots.sh"
    - "/usr/share/mahadevanos/postinstall/50-hardware-detect.sh"
    - "/usr/share/mahadevanos/postinstall/99-cleanup.sh"
