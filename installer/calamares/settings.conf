# Calamares settings for MahaDevan's OS (blueprint §5 M2).
# Offline, Garuda-style install: unpackfs copies the live squashfs onto the disk.
# Nothing is downloaded and nothing is compiled during install.
---
modules-search: [ local, /usr/lib/calamares/modules ]

# shellprocess is used twice: `preflight` guards the target root mount before
# unpackfs, `postinstall` runs the target's install scripts after the users
# module. A module used more than once must be declared as instances.
instances:
  - id:       unpackfs
    module:   unpackfs
    config:   unpackfs.conf
  - id:       preflight
    module:   shellprocess
    config:   preflight.conf
  - id:       postinstall
    module:   shellprocess
    config:   shellprocess.conf

sequence:
  # Upstream order: the pages the user fills in, then the exec phase, then the
  # finished page. `finished` must NOT be in this list.
  #
  # This is what broke the 2026-11-22 hand install: FinishedViewStep reports
  # isAtEnd() == true and isNextEnabled() == false (src/modules/finished/
  # FinishedViewStep.cpp), and Calamares keeps the written order of the sequence
  # phases (Settings::interpretSequence -> ModuleManager::loadModules). With
  # `finished` at the end of THIS show list it sat between the summary page and
  # the exec phase, so clicking "Install" on the summary page jumped straight to
  # "All done. <OS> has been installed on your computer." and the exec phase was
  # unreachable: nothing was ever partitioned, unpacked or bootloaded.
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      - partition
      - mount
      # Aborts with "PREFLIGHT FAILED" if "/" is not a block-device mount.
      # Without it, unpackfs writes the squashfs into the installer's tmpfs
      # when the root partition did not mount (rsync exit 11).
      # Sequence entries name the instance key "module@id", not just the id.
      - shellprocess@preflight
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      # No `initcpio` module: the unpacked target has no /boot/vmlinuz-* (mkarchiso
      # deletes /boot from the airootfs), so Calamares' own initcpio module fails.
      # postinstall runs 10-mkinitcpio.sh, which restores both kernels and
      # regenerates both initramfs with the installed system's configuration.
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@postinstall
      - grubcfg
      - bootloader
      - umount

  # The finished page belongs after the exec phase, in its own show list.
  - show:
      - finished

branding: mahadevanos

prompt-install: false
dont-chroot: false
oem-setup: false
# Must stay false while `finished` is in the sequence: ViewManager::
# updateButtonLabels() calls quit() as soon as the last step is the finished
# page, which hid the finished page instantly and made its Done/restart button
# do nothing (2026-11-22).
disable-cancel-during-exec: true
quit-at-end: false
